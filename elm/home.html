<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Elm Generated JS Example</title>
  <script src="elm.js" defer></script>
</head>
<body>
  <h1>Elm App Embedded</h1>
  <div id="elm-node"></div>

  <script>
    // Initialize the Elm app into the div with id 'elm-node'
    var app = Elm.Main.init({
      node: document.getElementById('elm-node')
    });
  </script>
</body>
</html>
