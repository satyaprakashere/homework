<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Bookmarks</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="navbar">
            <div class="nav-left">
                <a href="/" class="logo">
                    <span class="logo-box">S</span>
                    <span class="logo-text">News</span>
                </a>
            </div>
        </header>

        <main class="content">
            <div class="submit-container" style="padding: 20px; max-width: 400px; margin: 40px auto;">
                <h1 style="font-size: 1.5rem; margin-bottom: 20px; color: var(--text-primary);">Register</h1>
                <form action="/register" method="POST" class="submit-form">
                    <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="username" style="display: block; margin-bottom: 5px; color: var(--text-secondary); font-weight: 500;">Username</label>
                        <input type="text" id="username" name="username" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-secondary); color: var(--text-primary); font-family: inherit;">
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="password" style="display: block; margin-bottom: 5px; color: var(--text-secondary); font-weight: 500;">Password</label>
                        <input type="password" id="password" name="password" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-secondary); color: var(--text-primary); font-family: inherit;">
                    </div>
                    <button type="submit" class="submit-btn" style="width: 100%; background: var(--accent-color); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600;">Register</button>
                </form>
                <p style="margin-top: 20px; text-align: center; color: var(--text-secondary);">
                    Already have an account? <a href="/login" style="color: var(--accent-color); text-decoration: none;">Login</a>
                </p>
            </div>
        </main>
    </div>
</body>

</html>
