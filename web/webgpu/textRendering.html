<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Devanagari Renderer</title>
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 1px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #000; /* Canvas background */
        }
        #status {
            margin-bottom: 1rem;
            color: #aaf;
        }
        .error {
            color: #ff5555;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="status">Initializing WebGPU...</div>
    <canvas id="gpuCanvas" width="600" height="400"></canvas>

    <script type="module">
        async function init() {
            const statusDiv = document.getElementById("status");
            
            // 1. Check Support
            if (!navigator.gpu) {
                statusDiv.innerHTML = "<span class='error'>WebGPU not supported in this browser.</span>";
                return;
            }

            try {
                // 2. Setup Device & Context
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) throw new Error("No appropriate GPUAdapter found.");
                
                const device = await adapter.requestDevice();
                const canvas = document.getElementById("gpuCanvas");
                const context = canvas.getContext("webgpu");
                const presentationFormat = navigator.gpu.getPreferredCanvasFormat();

                context.configure({
                    device,
                    format: presentationFormat,
                    alphaMode: "premultiplied",
                });

                statusDiv.innerText = "Rendering Devanagari via Canvas -> Texture...";

                // =========================================================
                // PART A: The "Hybrid" Text Generation (2D Canvas)
                // =========================================================
                
                // We use a temporary 2D canvas to handle Devanagari shaping (ligatures/matras)
                const text = "नमस्ते दुनिया Hello World"; // "Namaste Duniya"
                const fontSize = 64;
                // Use a font stack that definitely includes Devanagari
                const font = `bold ${fontSize}px 'Noto Sans Devanagari', 'Mangal', 'Arial Unicode MS', sans-serif`;

                // Measure text to create a tightly fitted texture
                const tempCtx = document.createElement("canvas").getContext("2d");
                tempCtx.font = font;
                const metrics = tempCtx.measureText(text);
                const textWidth = Math.ceil(metrics.width);
                const textHeight = Math.ceil(fontSize * 1.5); // Buffer for vertical accents

                // Create the source canvas
                const sourceCanvas = document.createElement("canvas");
                sourceCanvas.width = textWidth;
                sourceCanvas.height = textHeight;
                const ctx = sourceCanvas.getContext("2d");

                // Draw text (Transparent background, White text)
                ctx.fillStyle = "#ffffff";
                ctx.font = font;
                ctx.textBaseline = "middle";
                ctx.fillText(text, 0, textHeight / 2);

                // =========================================================
                // PART B: WebGPU Resource Creation
                // =========================================================

                // Create a texture to hold the text image
                const textTexture = device.createTexture({
                    size: [textWidth, textHeight, 1],
                    format: 'rgba8unorm',
                    usage: GPUTextureUsage.TEXTURE_BINDING | 
                           GPUTextureUsage.COPY_DST | 
                           GPUTextureUsage.RENDER_ATTACHMENT,
                });

                // Copy the 2D canvas data into the WebGPU texture
                device.queue.copyExternalImageToTexture(
                    { source: sourceCanvas, flipY: true }, // flipY aligns it correctly for standard UVs
                    { texture: textTexture },
                    [textWidth, textHeight]
                );

                // =========================================================
                // PART C: Pipeline & Shaders
                // =========================================================

                const shaderModule = device.createShaderModule({
                    code: `
                        struct VertexOutput {
                            @builtin(position) position : vec4f,
                            @location(0) uv : vec2f,
                        }

                        @vertex
                        fn vs_main(@builtin(vertex_index) vertexIndex : u32) -> VertexOutput {
                            // Generating a quad (2 triangles) using a hardcoded array
                            // to avoid setting up vertex buffers for this simple example.
                            var pos = array<vec2f, 6>(
                                vec2f(-0.8, -0.4), vec2f(0.8, -0.4), vec2f(-0.8, 0.4), // Triangle 1
                                vec2f(-0.8, 0.4), vec2f(0.8, -0.4), vec2f(0.8, 0.4)    // Triangle 2
                            );
                            
                            // UV coordinates to map the texture
                            var uv = array<vec2f, 6>(
                                vec2f(0.0, 1.0), vec2f(1.0, 1.0), vec2f(0.0, 0.0),
                                vec2f(0.0, 0.0), vec2f(1.0, 1.0), vec2f(1.0, 0.0)
                            );

                            var output : VertexOutput;
                            output.position = vec4f(pos[vertexIndex], 0.0, 1.0);
                            output.uv = uv[vertexIndex];
                            return output;
                        }

                        @group(0) @binding(0) var mySampler : sampler;
                        @group(0) @binding(1) var myTexture : texture_2d<f32>;

                        @fragment
                        fn fs_main(@location(0) uv : vec2f) -> vec4f {
                            // Sample the text texture
                            let color = textureSample(myTexture, mySampler, uv);
                            
                            // Simple hack: color the white text orange
                            // Keep alpha channel intact for transparency
                            return vec4f(1.0, 0.6, 0.2, color.a); 
                        }
                    `
                });

                // Setup Blending (Crucial for text transparency)
                const pipeline = device.createRenderPipeline({
                    layout: 'auto',
                    vertex: {
                        module: shaderModule,
                        entryPoint: 'vs_main',
                    },
                    fragment: {
                        module: shaderModule,
                        entryPoint: 'fs_main',
                        targets: [{
                            format: presentationFormat,
                            blend: {
                                color: {
                                    srcFactor: 'src-alpha',
                                    dstFactor: 'one-minus-src-alpha',
                                    operation: 'add',
                                },
                                alpha: {
                                    srcFactor: 'one',
                                    dstFactor: 'one-minus-src-alpha',
                                    operation: 'add',
                                },
                            },
                        }],
                    },
                    primitive: {
                        topology: 'triangle-list',
                    },
                });

                const sampler = device.createSampler({
                    magFilter: 'linear',
                    minFilter: 'linear',
                });

                const bindGroup = device.createBindGroup({
                    layout: pipeline.getBindGroupLayout(0),
                    entries: [
                        { binding: 0, resource: sampler },
                        { binding: 1, resource: textTexture.createView() },
                    ],
                });

                // =========================================================
                // PART D: Render Loop
                // =========================================================
                
                function frame() {
                    const commandEncoder = device.createCommandEncoder();
                    const textureView = context.getCurrentTexture().createView();

                    const renderPass = commandEncoder.beginRenderPass({
                        colorAttachments: [{
                            view: textureView,
                            clearValue: { r: 0.1, g: 0.1, b: 0.12, a: 1.0 }, // Dark blue-grey background
                            loadOp: 'clear',
                            storeOp: 'store',
                        }],
                    });

                    renderPass.setPipeline(pipeline);
                    renderPass.setBindGroup(0, bindGroup);
                    renderPass.draw(6); // Draw 6 vertices (2 triangles)
                    renderPass.end();

                    device.queue.submit([commandEncoder.finish()]);
                    requestAnimationFrame(frame);
                }

                requestAnimationFrame(frame);

            } catch (err) {
                console.error(err);
                statusDiv.innerHTML = `<span class="error">Error: ${err.message}</span>`;
            }
        }

        init();
    </script>
</body>
</html>
