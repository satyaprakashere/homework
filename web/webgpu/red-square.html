<html>
<head>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        canvas {
            background: #333;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <canvas id="gpuCanvas" width="640" height="480"></canvas>
    <script type="module">
    async function init_webgpu() {
        if (!navigator.gpu) {
            console.error("WebGPU is not available.");
            alert("WebGPU support is not available. A WebGPU capable browser is required to run this sample.");
            throw new Error("WebGPU support is not available");        
        }r

        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            console.error("Failed to request Adapter.");
            return;
        }
        let device = await adapter.requestDevice();
        if (!device) {
            console.error("Failed to request Device.");
            return;
        }

        const context = canvas.getContext('webgpu');

        const canvasConfig = {
            device: device,
            format: navigator.gpu.getPreferredCanvasFormat(),
            usage:
                GPUTextureUsage.RENDER_ATTACHMENT,
            alphaMode: 'opaque'
        };

        context.configure(canvasConfig);
        let colorTexture = context.getCurrentTexture();
        let colorTextureView = colorTexture.createView();

        let colorAttachment = {
            view: colorTextureView,
            clearValue: { r: 1, g: 0, b: 0, a: 1 },
            loadOp: 'clear',
            storeOp: 'store'
        };

        const renderPassDesc = {
            colorAttachments: [colorAttachment]
        };
        commandEncoder = device.createCommandEncoder();

        passEncoder = commandEncoder.beginRenderPass(renderPassDesc);
        passEncoder.setViewport(0, 0, canvas.width, canvas.height, 0, 1);
        passEncoder.end();

        device.queue.submit([commandEncoder.finish()]);
    }

    init_webgpu();
    </script>
    </body>

</html>
