<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekursion WebGPU Lab</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        gpuCanvas {
            background: #fff;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <canvas id="gpuCanvas"></canvas>
    <div id="log"><div class="status">> Initializing WebGPU Pipeline...</div></div>

    <script type="module">
        const log = (msg) => {
            const entry = document.createElement('div');
            entry.textContent = `> ${msg}`;
            document.getElementById('log').appendChild(entry);
            document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
        };

        async function init() {
            if (!navigator.gpu) {
                log("Error: WebGPU not supported in this browser. Try Chrome Canary or Safari Technology Preview.");
                return;
            }

            const adapter = await navigator.gpu.requestAdapter();
            const device = await adapter.requestDevice();
            log(`Device Acquired: ${adapter.name || 'Generic GPU'}`);

            const canvas = document.getElementById('gpuCanvas');
            const context = canvas.getContext('webgpu');
            
            const presentationFormat = navigator.gpu.getPreferredCanvasFormat();
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;

            context.configure({
                device,
                format: presentationFormat,
                alphaMode: 'premultiplied',
            });

            // WGSL Shader Code
            const shaderModule = device.createShaderModule({
                code: `
                    @vertex
                    fn vs_main(@builtin(vertex_index) VertexIndex : u32) -> @builtin(position) vec4<f32> {
                        var pos = array<vec2<f32>, 3>(
                            vec2<f32>(0.0, 0.5),
                            vec2<f32>(-0.5, -0.5),
                            vec2<f32>(0.5, -0.5)
                        );
                        return vec4<f32>(pos[VertexIndex], 0.0, 1.0);
                    }

                    @fragment
                    fn fs_main() -> @location(0) vec4<f32> {
                        return vec4<f32>(0.0, 1.0, 0.6, 1.0); // Rekursion Green
                    }
                `
            });

            const pipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: { module: shaderModule, entryPoint: 'vs_main' },
                fragment: {
                    module: shaderModule,
                    entryPoint: 'fs_main',
                    targets: [{ format: presentationFormat }]
                },
                primitive: { topology: 'triangle-list' }
            });

            function frame() {
                const commandEncoder = device.createCommandEncoder();
                const textureView = context.getCurrentTexture().createView();

                const renderPassDescriptor = {
                    colorAttachments: [{
                        view: textureView,
                        clearValue: { r: 0.1, g: 0.1, b: 0.1, a: 1.0 },
                        loadOp: 'clear',
                        storeOp: 'store',
                    }]
                };

                const passEncoder = commandEncoder.beginRenderPass(renderPassDescriptor);
                passEncoder.setPipeline(pipeline);
                passEncoder.draw(3, 1, 0, 0);
                passEncoder.end();

                device.queue.submit([commandEncoder.finish()]);
                requestAnimationFrame(frame);
            }

            log("Pipeline Ready. Rendering at 60FPS.");
            requestAnimationFrame(frame);
        }

        init().catch(err => log(`Runtime Error: ${err.message}`));
    </script>
</body>
</html>
