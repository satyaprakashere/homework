<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Hello There!</title>
		<style>
			body {
				margin: 0;
				background: #111;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
			}

			canvas {
				background: #fff;
				border: 1px solid #333;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas" width="700" height="220"></canvas>
	</body>
	<script>
	    // (val canvas (document.getElementById "canvas"))

		const canvas = document.getElementById("canvas");
		const ctx = canvas.getContext("2d");
		ctx.font = "30px serif";

		// Default (auto)
		ctx.fillText(`Hello world (default: ${ctx.textRendering})`, 5, 20);

		// Text rendering: optimizeSpeed
		ctx.textRendering = "optimizeSpeed";
		ctx.fillText(`Hello world (${ctx.textRendering})`, 5, 50);

		// Text rendering: optimizeLegibility
		ctx.textRendering = "optimizeLegibility";
		ctx.fillText(`Hello world (${ctx.textRendering})`, 5, 80);

		// Text rendering: geometricPrecision
		ctx.textRendering = "geometricPrecision";
		ctx.fillText(`Hello world (${ctx.textRendering})`, 5, 110);
	</script>
</html>
