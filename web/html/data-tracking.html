<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>User Tracking & Fingerprinting Lab</title>
        <style>
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                line-height: 1.6;
                background: #f4f4f9;
                color: #333;
                padding: 20px;
            }
            .container {
                max-width: 900px;
                margin: auto;
                background: white;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }
            h1 {
                color: #d9534f;
                border-bottom: 2px solid #d9534f;
                padding-bottom: 10px;
            }
            section {
                margin-bottom: 25px;
            }
            h2 {
                font-size: 1.2rem;
                color: #555;
                background: #eee;
                padding: 8px;
                border-left: 4px solid #d9534f;
            }
            .data-grid {
                display: grid;
                grid-template-columns: 1fr 2fr;
                gap: 10px;
                font-family: monospace;
                font-size: 0.9rem;
            }
            .label {
                font-weight: bold;
                color: #777;
            }
            .value {
                color: #222;
                word-break: break-all;
            }
            .warning {
                font-style: italic;
                color: #888;
                font-size: 0.8rem;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Browser Fingerprint & Tracking Data</h1>
            <p>
                This page demonstrates the data a website can collect without
                asking for specific permissions (like GPS or Camera).
            </p>

            <section id="system">
                <h2>Hardware & OS</h2>
                <div class="data-grid" id="system-data"></div>
            </section>

            <section id="screen">
                <h2>Screen & Display</h2>
                <div class="data-grid" id="screen-data"></div>
            </section>

            <section id="network">
                <h2>Network & Connection</h2>
                <div class="data-grid" id="network-data"></div>
            </section>

            <section id="graphics">
                <h2>Graphics (WebGPU/WebGL)</h2>
                <div class="data-grid" id="graphics-data"></div>
            </section>
        </div>

        <script>
            const systemData = {
                "User Agent": navigator.userAgent,
                Platform: navigator.platform,
                "CPU Cores": navigator.hardwareConcurrency || "Unknown",
                "Device Memory": navigator.deviceMemory
                    ? navigator.deviceMemory + " GB"
                    : "Unknown",
                Language: navigator.language,
                Timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                "Cookies Enabled": navigator.cookieEnabled,
            };

            const screenData = {
                Resolution: `${window.screen.width}x${window.screen.height}`,
                "Available Res": `${window.screen.availWidth}x${window.screen.availHeight}`,
                "Color Depth": window.screen.colorDepth + " bits",
                "Pixel Ratio": window.devicePixelRatio,
                "Touch Support": navigator.maxTouchPoints > 0 ? "Yes" : "No",
            };

            const networkData = {
                "Online Status": navigator.onLine ? "Online" : "Offline",
                "Connection Type": navigator.connection
                    ? navigator.connection.effectiveType
                    : "N/A",
                "Downlink Speed": navigator.connection
                    ? navigator.connection.downlink + " Mbps"
                    : "N/A",
            };

            function render(data, elementId) {
                const container = document.getElementById(elementId);
                for (const [label, value] of Object.entries(data)) {
                    container.innerHTML += `<div class="label">${label}:</div><div class="value">${value}</div>`;
                }
            }

            // Graphics Info (Fingerprinting goldmine)
            function getGraphicsInfo() {
                const canvas = document.createElement("canvas");
                const gl =
                    canvas.getContext("webgl") ||
                    canvas.getContext("experimental-webgl");
                if (!gl) return { Status: "WebGL Not Supported" };

                const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
                return {
                    Renderer: debugInfo
                        ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
                        : "Hidden",
                    Vendor: debugInfo
                        ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL)
                        : "Hidden",
                };
            }

            render(systemData, "system-data");
            render(screenData, "screen-data");
            render(networkData, "network-data");
            render(getGraphicsInfo(), "graphics-data");

            // Battery Info (Async)
            if (navigator.getBattery) {
                navigator.getBattery().then((battery) => {
                    const batteryInfo = {
                        "Battery Level": battery.level * 100 + "%",
                        Charging: battery.charging ? "Yes" : "No",
                    };
                    const sec = document.getElementById("system-data");
                    for (const [label, value] of Object.entries(batteryInfo)) {
                        sec.innerHTML += `<div class="label">${label}:</div><div class="value">${value}</div>`;
                    }
                });
            }
        </script>
    </body>
</html>
