<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekursion Notes</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #00ff99;
            --text: #e0e0e0;
            --danger: #ff5555;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 2rem 0;
            text-align: center;
            border-bottom: 1px solid var(--surface);
        }

        h1 { margin: 0; color: var(--primary); font-family: 'Courier New', monospace; }

        .container {
            width: 90%;
            max-width: 800px;
            margin-top: 2rem;
        }

        /* Input Section */
        .note-input-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 2rem;
        }

        input, textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            outline: none;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input { font-weight: bold; margin-bottom: 1rem; border-bottom: 1px solid #333; padding-bottom: 0.5rem; }
        textarea { height: 100px; resize: none; font-family: inherit; }

        .actions { display: flex; justify-content: flex-end; }
        
        button {
            background: var(--primary);
            color: black;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.8; }

        /* Notes Grid */
        #notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            padding-bottom: 3rem;
        }

        .note {
            background: var(--surface);
            padding: 1.2rem;
            border-radius: 8px;
            position: relative;
            border-left: 4px solid var(--primary);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .note h3 { margin: 0 0 0.5rem 0; font-size: 1.1rem; color: var(--primary); }
        .note p { margin: 0; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
        .note .date { font-size: 0.7rem; color: #888; margin-top: 1rem; display: block; }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            color: #555;
            font-size: 1.2rem;
            padding: 0;
        }
        .delete-btn:hover { color: var(--danger); }

    </style>
</head>
<body>

    <header>
        <h1>// REKURSION_NOTES</h1>
    </header>

    <div class="container">
        <div class="note-input-card">
            <input type="text" id="note-title" placeholder="Title (e.g., Compiler TODOs)">
            <textarea id="note-content" placeholder="Take a note..."></textarea>
            <div class="actions">
                <button onclick="addNote()">Save Note</button>
            </div>
        </div>

        <div id="notes-grid"></div>
    </div>

    <script>
        const notesGrid = document.getElementById('notes-grid');
        let notes = JSON.parse(localStorage.getItem('rekursion_notes')) || [];

        function renderNotes() {
            notesGrid.innerHTML = '';
            notes.forEach((note, index) => {
                const noteEl = document.createElement('div');
                noteEl.classList.add('note');
                noteEl.innerHTML = `
                    <button class="delete-btn" onclick="deleteNote(${index})">&times;</button>
                    <h3>${note.title || 'Untitled'}</h3>
                    <p>${note.content}</p>
                    <span class="date">${note.date}</span>
                `;
                notesGrid.appendChild(noteEl);
            });
        }

        function addNote() {
            const title = document.getElementById('note-title').value;
            const content = document.getElementById('note-content').value;

            if (!content.trim()) return;

            const newNote = {
                title,
                content,
                date: new Date().toLocaleString()
            };

            notes.unshift(newNote);
            localStorage.setItem('rekursion_notes', JSON.stringify(notes));
            
            // Clear inputs
            document.getElementById('note-title').value = '';
            document.getElementById('note-content').value = '';
            
            renderNotes();
        }

        function deleteNote(index) {
            notes.splice(index, 1);
            localStorage.setItem('rekursion_notes', JSON.stringify(notes));
            renderNotes();
        }

        // Initial Load
        renderNotes();
    </script>
</body>
</html>
