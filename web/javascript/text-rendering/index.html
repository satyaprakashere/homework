
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skia + WebGPU + TypeScript</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ececec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            /* Ensure the canvas is sharp on Retina displays */
            width: 800px;
            height: 600px;
        }

        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
        }

        .error {
            color: #ff5555;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2 id="header">Skia Graphite Renderer</h2>
    
    <canvas id="skia-canvas" width="1600" height="1200"></canvas>

    <div id="status">Initializing WebGPU and CanvasKit...</div>

    <script>
        const statusEl = document.getElementById('status');
        if (!navigator.gpu) {
            statusEl.innerHTML = '<span class="error">WebGPU is not supported in this browser.</span><br>Try Chrome Canary or enable the WebGPU flag.';
        }
    </script>

    <script type="module" src="/src/main.ts"></script>

</body>
</html>
