<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vedic Cosmic Chandelier - WebGL</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: #ffd700; font-family: sans-serif; font-size: 20px;
            text-shadow: 0px 0px 5px #000; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">TOVP Cosmic Chandelier Concept</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        // Add some fog for depth
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Orbit Controls to look around
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. LIGHTING
        const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft white light
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffd700, 1.5, 100);
        pointLight.position.set(10, 50, 10);
        scene.add(pointLight);

        // 3. OBJECTS

        // GROUP: The Entire Chandelier Structure
        const chandelierGroup = new THREE.Group();
        scene.add(chandelierGroup);

        // A. MOUNT MERU (Central Golden Inverted Cone)
        // Top radius larger than bottom radius
        const meruGeometry = new THREE.CylinderGeometry(8, 2, 20, 32, 1, true); 
        const goldMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffd700, 
            metalness: 0.8, 
            roughness: 0.2,
            side: THREE.DoubleSide
        });
        const meru = new THREE.Mesh(meruGeometry, goldMaterial);
        meru.position.y = 10;
        chandelierGroup.add(meru);

        // B. BHUMANDALA (Concentric Islands/Rings)
        // Creating 7 rings to represent the islands
        const ringColors = [0x2E8B57, 0x87CEEB, 0x2E8B57, 0x87CEEB, 0x2E8B57, 0x87CEEB, 0x2E8B57];
        
        for (let i = 0; i < 7; i++) {
            const innerR = 10 + (i * 4);
            const outerR = 12 + (i * 4);
            const ringGeo = new THREE.RingGeometry(innerR, outerR, 64);
            // Rotate ring to lie flat
            const ringMat = new THREE.MeshBasicMaterial({ 
                color: ringColors[i], 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.8
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            chandelierGroup.add(ring);
        }

        // C. PLANETARY ORBITS (Sun and Moon)
        // The Sun & Moon rotate around Meru
        const orbitsGroup = new THREE.Group();
        chandelierGroup.add(orbitsGroup);

        // Function to create a planet
        function createPlanet(size, color, dist, height, speed) {
            const planetGroup = new THREE.Group();
            
            // The orbit path (visual line)
            const orbitGeo = new THREE.TorusGeometry(dist, 0.1, 16, 100);
            const orbitMat = new THREE.MeshBasicMaterial({ color: 0x444444 });
            const orbitLine = new THREE.Mesh(orbitGeo, orbitMat);
            orbitLine.rotation.x = -Math.PI / 2;
            orbitLine.position.y = height;
            chandelierGroup.add(orbitLine);

            // The Planet mesh
            const geo = new THREE.SphereGeometry(size, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            
            // Pivot for rotation
            const pivot = new THREE.Object3D();
            pivot.position.y = height; // Set height of orbit
            
            mesh.position.x = dist; // Offset from center
            pivot.add(mesh);
            orbitsGroup.add(pivot);

            return { pivot: pivot, speed: speed };
        }

        const sunObj = createPlanet(2.5, 0xffaa00, 25, 15, 0.01); // Sun (Higher, slower)
        const moonObj = createPlanet(1.8, 0xffffff, 20, 20, 0.02); // Moon (Even higher)

        // D. STARS (Background)
        const starGeo = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i++) {
            starPos[i] = (Math.random() - 0.5) * 400;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({color: 0xffffff, size: 0.5});
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // 4. ANIMATION LOOP
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Rotate the entire Chandelier slightly (Cosmic Time)
            chandelierGroup.rotation.y += 0.0005;

            // Rotate Planets independently
            sunObj.pivot.rotation.y += sunObj.speed;
            moonObj.pivot.rotation.y += moonObj.speed;

            renderer.render(scene, camera);
        }

        // Handle Window Resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize(){
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        animate();
    </script>
</body>
</html>
