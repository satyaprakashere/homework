<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title></title>
    <style>
      .row {
        display: flex;
        text-align: center;
      }
      .leftColumn {
        flex: 1;            /* equal width columns */
        padding: 10px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }
      .column {
        flex: 1;            /* equal width columns */
        padding: 10px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }
      .rightColumn {
        flex: 1;            /* equal width columns */
        padding: 10px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }
    </style>
  </head>
<!--  background-color: #1a1a1a; -->
  <body style="margin: 0; height: 100vh;">
    <div class="row">
      <div class="leftColumn">Column 1</div>
      <div class="column">Column 2</div>
      <div class="rightColumn">Column 3</div>
    </div>
  </body>
</html>
